server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Without this, every JS/CSS asset ships uncompressed — the main bundle
    # alone is ~3x heavier over the wire than it needs to be.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/font-woff
        application/font-woff2
        image/svg+xml;

    # Swagger is disabled in production (see GB-BE/src/main.ts), block it here too as defense in depth.
    location = /api/v1/api/docs {
        return 403;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite content-hashes every filename in here — a new deploy always ships
    # new hashes, so caching these aggressively can never serve stale content.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
